
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="iLink - Your college community">

    <title>iLink | College Community</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

   
<main class="demo-container">
    <span class="badge">iLink Community</span>

    <h1>Welcome to iLink</h1>

    <p class="text-secondary">
        Your college community starts here.
    </p>

    <section class="card">
        <h2>Build your community</h2>

        <p class="text-secondary">
            Connect with students and share your ideas.
        </p>

        <button class="btn btn-primary">
            Get Started
        </button>

        <button class="btn btn-secondary">
            Explore
        </button>
    </section>

    <section class="card">
        <h2>Share an idea</h2>

        <input
            class="form-input"
            type="text"
            placeholder="What is on your mind?"
        >
    </section>
</main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="js/config.js"></script>
    <script src="js/core/ui.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
